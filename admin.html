<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiss Chess Tournament Manager</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
        .tab-active { border-bottom: 2px solid #3b82f6; color: #3b82f6; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        const PLAYER_NAMES = [
            'Presley', 'Samantha', 'Tim', 'Oleg', 'Ranvir', 'Joel', 'Deivis', 
            'Ethan', 'Grady', 'Rajan', 'Mamon', 'Geaner', 'Binyamin', 'Erik', 'Alex'
        ];

        const ROUND_1_MATCHES = [
            { id: 'r1-1', white: 'Presley', black: 'Grady', result: null },
            { id: 'r1-2', white: 'Samantha', black: 'Rajan', result: null },
            { id: 'r1-3', white: 'Tim', black: 'Mamon', result: null },
            { id: 'r1-4', white: 'Oleg', black: 'Geaner', result: null },
            { id: 'r1-5', white: 'Ranvir', black: 'Binyamin', result: null },
            { id: 'r1-6', white: 'Joel', black: 'Erik', result: null },
            { id: 'r1-7', white: 'Deivis', black: 'Alex', result: null },
            { id: 'r1-8', white: 'Ethan', black: 'BYE', result: '1-0' }
        ];

        function App() {
            const [rounds, setRounds] = useState([ROUND_1_MATCHES]);
            const [currentRoundIndex, setCurrentRoundIndex] = useState(0);
            const [activeTab, setActiveTab] = useState('matches');

            // Calculate standings dynamically based on all match results
            const standings = useMemo(() => {
                const stats = {};
                PLAYER_NAMES.forEach(name => {
                    stats[name] = { name, points: 0, matchesPlayed: 0, byes: 0, opponents: [] };
                });

                    round.forEach(match => {
                        if (!match.result) return;

                        if (match.black === 'BYE') {
                            stats[match.white].points += 1;
                            stats[match.white].byes += 1;
                            return;
                        }

                        stats[match.black].matchesPlayed += 1;
                        stats[match.white].opponents.push(match.black);
                        stats[match.black].opponents.push(match.white);
