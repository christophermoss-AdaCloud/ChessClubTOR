<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiss Chess Tournament Manager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for in-browser JSX transpilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
        }
        .tab-active {
            border-bottom: 2px solid #3b82f6;
            color: #60a5fa;
        }
        /* Hide file input visually but keep it clickable */
        .hidden-file-input {
            width: 0.1px;
            height: 0.1px;
            opacity: 0;
            overflow: hidden;
            position: absolute;
            z-index: -1;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div id="root" class="max-w-4xl mx-auto"></div>

    <script type="text/babel">
        const { useState, useMemo, useRef } = React;

        const INITIAL_PLAYERS = [
            { id: 'p1', name: 'Presley' }, { id: 'p2', name: 'Samantha' }, { id: 'p3', name: 'Tim' },
            { id: 'p4', name: 'Oleg' }, { id: 'p5', name: 'Ranvir' }, { id: 'p6', name: 'Joel' },
            { id: 'p7', name: 'Deivis' }, { id: 'p8', name: 'Ethan' }, { id: 'p9', name: 'Grady' },
            { id: 'p10', name: 'Rajan' }, { id: 'p11', name: 'Mamon' }, { id: 'p12', name: 'Geaner' },
            { id: 'p13', name: 'Binyamin' }, { id: 'p14', name: 'Erik' }, { id: 'p15', name: 'Alex' },
            { id: 'p16', name: 'Ky' }, { id: 'p17', name: 'Adam' }, { id: 'p18', name: 'Jay' }
        ];

        const ROUND_1 = [
            { id: 'r1_1', white: 'p1', black: 'p10', result: null, isBye: false },
            { id: 'r1_2', white: 'p2', black: 'p11', result: null, isBye: false },
            { id: 'r1_3', white: 'p3', black: 'p12', result: null, isBye: false },
            { id: 'r1_4', white: 'p4', black: 'p13', result: null, isBye: false },
            { id: 'r1_5', white: 'p5', black: 'p14', result: null, isBye: false },
            { id: 'r1_6', white: 'p6', black: 'p15', result: null, isBye: false },
            { id: 'r1_7', white: 'p7', black: 'p16', result: null, isBye: false },
            { id: 'r1_8', white: 'p8', black: 'p17', result: null, isBye: false },
            { id: 'r1_9', white: 'p9', black: 'p18', result: null, isBye: false }
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('matches');
            const [rounds, setRounds] = useState([ROUND_1]);
            const [selectedRound, setSelectedRound] = useState(0);
            const fileInputRef = useRef(null);

            // Calculate standings based on all current match results
            const standings = useMemo(() => {
                let stats = INITIAL_PLAYERS.reduce((acc, p) => {
                    acc[p.id] = { ...p, score: 0, played: new Set(), byes: 0 };
                    return acc;
                }, {});

                rounds.forEach(round => {
                    round.forEach(match => {
                        if (match.result) {
                            if (match.isBye) {
                                stats[match.white].score += 1;
                                stats[match.white].byes += 1;
                            } else {
                                stats[match.white].played.add(match.black);
                                stats[match.black].played.add(match.white);
                                
                                if (match.result === '1-0') stats[match.white].score += 1;
                                else if (match.result === '0-1') stats[match.black].score += 1;
                                else if (match.result === '0.5-0.5') {
                                    stats[match.white].score += 0.5;
                                    stats[match.black].score += 0.5;
                                }
                            }
                        }
                    });
                });

                return Object.values(stats).sort((a, b) => b.score - a.score);
            }, [rounds]);

            const updateMatchResult = (roundIndex, matchId, result) => {
                const newRounds = [...rounds];
                const matchIndex = newRounds[roundIndex].findIndex(m => m.id === matchId);
                newRounds[roundIndex][matchIndex] = { ...newRounds[roundIndex][matchIndex], result };
                setRounds(newRounds);
            };

            const generateNextRound = () => {
                if (rounds.length >= 5) {
                    alert("Tournament is already 5 rounds!");
                    return;
                }

                const currentRound = rounds[rounds.length - 1];
                if (currentRound.some(m => m.result === null)) {
                    alert("Please finish all matches in the current round before proceeding.");
                    return;
                }

                let unassigned = [...standings];
                let nextMatches = [];
                let roundId = rounds.length + 1;
                let matchCount = 1;

                if (unassigned.length % 2 !== 0) {
                    let byeIndex = unassigned.length - 1;
                    while (byeIndex >= 0 && unassigned[byeIndex].byes > 0) byeIndex--;
                    if (byeIndex < 0) byeIndex = unassigned.length - 1; 
                    
                    let byePlayer = unassigned.splice(byeIndex, 1)[0];
                    nextMatches.push({
                        id: `r${roundId}_${matchCount++}`,
                        white: byePlayer.id,
                        black: null,
                        result: '1-0',
                        isBye: true
                    });
                }

                while (unassigned.length > 1) {
                    let p1 = unassigned.shift();
                    let p2Index = 0;
                    
                    while (p2Index < unassigned.length && p1.played.has(unassigned[p2Index].id)) {
                        p2Index++;
                    }
                    if (p2Index >= unassigned.length) p2Index = 0; 

                    let p2 = unassigned.splice(p2Index, 1)[0];
                    nextMatches.push({
                        id: `r${roundId}_${matchCount++}`,
                        white: p1.id,
                        black: p2.id,
                        result: null,
                        isBye: false
                    });
                }

                setRounds([...rounds, nextMatches]);
                setSelectedRound(rounds.length); 
            };

            const getPlayerName = (id) => INITIAL_PLAYERS.find(p => p.id === id)?.name || id;

            // ==========================================
            // CSV EXPORT / IMPORT LOGIC
            // ==========================================
            
            const exportToCSV = () => {
                // Header row
                let csvContent = "Round,MatchID,WhiteID,WhiteName,BlackID,BlackName,Result,IsBye
";
                
                rounds.forEach((round, roundIndex) => {
                    round.forEach(match => {
                        const roundNum = roundIndex + 1;
                        const whiteName = getPlayerName(match.white);
                        const blackName = match.isBye ? "BYE" : getPlayerName(match.black);
                        const result = match.result || "null";
                        
                        csvContent += `${roundNum},${match.id},${match.white},${whiteName},${match.black || 'null'},${blackName},${result},${match.isBye}
`;
                    });
                });

                // Create blob and download trigger
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", `chess_tournament_state.csv`);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleFileUpload = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const text = e.target.result;
                        const lines = text.split('\n').filter(line => line.trim() !== '');
                        
                        if (lines.length < 2) throw new Error("File is empty or invalid format.");
                        
                        // Check header
                        const header = lines[0].split(',');
                        if (header[0] !== "Round" || header[1] !== "MatchID") {
                            throw new Error("Invalid CSV format. Please upload a file generated by this application.");
                        }

                        // Parse rows back into rounds array
                        const newRounds = [];
                        for (let i = 1; i < lines.length; i++) {
                            const [roundStr, matchId, white, whiteName, black, blackName, resultStr, isByeStr] = lines[i].split(',');
                            
                            const roundIndex = parseInt(roundStr) - 1;
                            const result = resultStr === "null" ? null : resultStr;
                            const isBye = isByeStr === "true";
                            const blackVal = black === "null" ? null : black;

                            if (!newRounds[roundIndex]) {
                                newRounds[roundIndex] = [];
                            }

                            newRounds[roundIndex].push({
                                id: matchId,
                                white: white,
                                black: blackVal,
                                result: result,
                                isBye: isBye
                            });
                        }

                        setRounds(newRounds);
                        setSelectedRound(Math.max(0, newRounds.length - 1));
                        alert("Tournament state restored successfully!");
                        
                    } catch (error) {
                        alert("Error parsing CSV: " + error.message);
                    }
                    // Reset input
                    event.target.value = null;
                };
                reader.readAsText(file);
            };

            // ==========================================

            return (
                <div className="bg-slate-800 rounded-xl shadow-2xl p-6 border border-slate-700">
                    <header className="mb-8 flex justify-between items-start">
                        <div>
                            <h1 className="text-3xl font-bold text-white mb-2">🏆 Swiss Chess Tournament</h1>
                            <p className="text-slate-400">5-Round Swiss System • 18 Players</p>
                        </div>
                        
                        {/* Import/Export Controls */}
                        <div className="flex space-x-3">
                            <input 
                                type="file" 
                                id="csv-upload" 
                                accept=".csv" 
                                className="hidden-file-input"
                                ref={fileInputRef}
                                onChange={handleFileUpload} 
                            />
                            <button 
                                onClick={() => fileInputRef.current.click()}
                                className="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-semibold rounded shadow transition-colors flex items-center"
                            >
                                <svg className="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
                                Import CSV
                            </button>
                            <button 
                                onClick={exportToCSV}
                                className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold rounded shadow transition-colors flex items-center"
                            >
                                <svg className="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                                Export CSV
                            </button>
                        </div>
                    </header>

                    {/* Navigation */}
                    <div className="flex space-x-6 border-b border-slate-700 mb-6">
                        <button 
                            className={`pb-3 font-semibold transition-colors hover:text-blue-400 ${activeTab === 'matches' ? 'tab-active' : 'text-slate-400'}`}
                            onClick={() => setActiveTab('matches')}
                        >
                            Matches & Pairings
                        </button>
                        <button 
                            className={`pb-3 font-semibold transition-colors hover:text-blue-400 ${activeTab === 'standings' ? 'tab-active' : 'text-slate-400'}`}
                            onClick={() => setActiveTab('standings')}
                        >
                            Live Standings
                        </button>
                        <button 
                            className={`pb-3 font-semibold transition-colors hover:text-blue-400 ${activeTab === 'settings' ? 'tab-active' : 'text-slate-400'}`}
                            onClick={() => setActiveTab('settings')}
                        >
                            Rules & Settings
                        </button>
                    </div>

                    {/* Tab: Matches */}
                    {activeTab === 'matches' && (
                        <div>
                            <div className="flex justify-between items-center mb-6">
                                <div className="flex space-x-2 overflow-x-auto pb-2 max-w-[60%]">
                                    {rounds.map((_, idx) => (
                                        <button
                                            key={idx}
                                            onClick={() => setSelectedRound(idx)}
                                            className={`px-4 py-2 rounded-lg font-medium transition-colors whitespace-nowrap ${selectedRound === idx ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}`}
                                        >
                                            Round {idx + 1}
                                        </button>
                                    ))}
                                </div>
                                <button
                                    onClick={generateNextRound}
                                    disabled={rounds.length >= 5}
                                    className="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2 rounded-lg font-semibold shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                                >
                                    {rounds.length >= 5 ? 'Tournament Complete' : '+ Generate Next Round'}
                                </button>
                            </div>

                            <div className="grid gap-4">
                                {rounds[selectedRound].map((match, idx) => (
                                    <div key={match.id} className="bg-slate-750 border border-slate-700 p-4 rounded-lg flex items-center justify-between">
                                        <div className="flex items-center space-x-4 w-1/3">
                                            <div className="w-4 h-4 rounded-full bg-white border border-slate-300 shadow-sm"></div>
                                            <span className="font-semibold text-lg">{getPlayerName(match.white)}</span>
                                        </div>
                                        
                                        <div className="w-1/3 flex justify-center">
                                            {match.isBye ? (
                                                <span className="px-3 py-1 bg-slate-700 text-emerald-400 rounded-full text-sm font-bold uppercase tracking-wider">Bye (1 pt)</span>
                                            ) : (
                                                <div className="flex space-x-2 bg-slate-900 rounded-lg p-1">
                                                    <button 
                                                        onClick={() => updateMatchResult(selectedRound, match.id, '1-0')}
                                                        className={`px-3 py-1 rounded-md text-sm font-bold ${match.result === '1-0' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}
                                                    >1-0</button>
                                                    <button 
                                                        onClick={() => updateMatchResult(selectedRound, match.id, '0.5-0.5')}
                                                        className={`px-3 py-1 rounded-md text-sm font-bold ${match.result === '0.5-0.5' ? 'bg-slate-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}
                                                    >½-½</button>
                                                    <button 
                                                        onClick={() => updateMatchResult(selectedRound, match.id, '0-1')}
                                                        className={`px-3 py-1 rounded-md text-sm font-bold ${match.result === '0-1' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}
                                                    >0-1</button>
                                                </div>
                                            )}
                                        </div>

                                        <div className="flex items-center space-x-4 w-1/3 justify-end">
                                            <span className="font-semibold text-lg">{match.isBye ? '--' : getPlayerName(match.black)}</span>
                                            {!match.isBye && <div className="w-4 h-4 rounded-full bg-black border border-slate-600 shadow-sm"></div>}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Tab: Standings */}
                    {activeTab === 'standings' && (
                        <div className="bg-slate-900 rounded-lg overflow-hidden border border-slate-700">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-slate-950 text-slate-400 text-sm uppercase tracking-wider">
                                        <th className="p-4 py-3 font-semibold">Rank</th>
                                        <th className="p-4 py-3 font-semibold">Player</th>
                                        <th className="p-4 py-3 font-semibold text-right">Score</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-800">
                                    {standings.map((player, idx) => (
                                        <tr key={player.id} className="hover:bg-slate-800/50 transition-colors">
                                            <td className="p-4 text-slate-400 font-medium">#{idx + 1}</td>
                                            <td className="p-4 font-semibold text-white">{player.name}</td>
                                            <td className="p-4 text-right font-bold text-blue-400">{player.score.toFixed(1)}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {/* Tab: Settings */}
                    {activeTab === 'settings' && (
                        <div className="space-y-6">
                            <div className="bg-slate-900 p-6 rounded-lg border border-slate-700">
                                <h3 className="text-xl font-bold text-white mb-3">Time Control & Match Settings</h3>
                                <ul className="space-y-3 text-slate-300">
                                    <li className="flex items-start"><span className="mr-3 text-blue-500">⏱</span> <strong>Standard Time:</strong> 15 minutes per player per game.</li>
                                    <li className="flex items-start"><span className="mr-3 text-blue-500">⚖️</span> <strong>Timeout Rule:</strong> If the game is not won after 15 minutes, piece points are used to calculate the winner.</li>
                                    <li className="flex items-start"><span className="mr-3 text-blue-500">🔄</span> <strong>Rounds:</strong> 5-Round Swiss System. Players are matched against opponents with similar running scores. No player receives more than one Bye.</li>
                                </ul>
                            </div>

                            <div className="bg-slate-900 p-6 rounded-lg border border-slate-700">
                                <h3 className="text-xl font-bold text-white mb-3">Tiebreak Mechanism (If used for playoffs)</h3>
                                <div className="space-y-4 text-slate-300">
                                    <div className="pl-4 border-l-2 border-slate-700">
                                        <h4 className="font-semibold text-white">1. Game 1</h4>
                                        <p className="text-sm mt-1">Base match time control (draw = proceed to tiebreak).</p>
                                    </div>
                                    <div className="pl-4 border-l-2 border-slate-700">
                                        <h4 className="font-semibold text-white">2. Blitz Playoff</h4>
                                        <p className="text-sm mt-1">3 minutes per player, timed.</p>
                                    </div>
                                    <div className="pl-4 border-l-2 border-slate-700">
                                        <h4 className="font-semibold text-white">3. Armageddon</h4>
                                        <p className="text-sm mt-1">White gets 5 minutes, Black gets 4 minutes. Black has draw odds (Black wins the match if the game ends in a draw).</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
